name: aiovy
description: "Aiovy — explainable maternal health risk classification prototype (LPU Cavite CS Thesis)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons (part of the default Flutter template).
  cupertino_icons: ^1.0.2

  # Not used yet. Added now so the Week 3 Flask API call (/predict)
  # can be dropped in without touching dependencies again.
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
